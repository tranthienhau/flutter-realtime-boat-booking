<!-- Mobile Viewport Shell (393px × 852px) -->

<div class="flex items-center gap-1.5 text-text-primary">

<span class="material-symbols-outlined text-[16px] leading-none" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[18px] leading-none" data-icon="battery_full">battery_full</span>

<!-- Brand Wordmark Centered -->

<span class="material-symbols-outlined text-secondary text-[22px]" data-icon="sailing">sailing</span>

</div>

<button class="text-label-md font-label-md text-text-secondary hover:text-secondary transition-colors duration-200 active:scale-95 px-2 py-1" type="button">

          Welcome aboard

<p class="font-body-md text-body-md text-text-secondary mt-1 leading-snug">
          Sign in to access your charters, live tracking, and bookings.
        </p>
</div>
<!-- Form Inputs & Controls -->
<form class="space-y-3.5 flex-shrink-0" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-text-primary font-medium" for="email">

</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-text-primary font-medium" for="password">
              Password

<a class="font-label-md text-caption-sm text-primary-container font-medium hover:underline transition-colors" href="#">
              Forgot password?
            </a>
</div>

<input class="w-full h-12 pl-3.5 pr-11 bg-surface text-text-primary font-body-md text-base rounded-xl border border-border-hairline focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/30 transition-all shadow-sm tracking-widest" id="password" name="password" placeholder="Enter your password" type="password" value="••••••••••••"/>

<span>Sign in</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>

<!-- Hairline Divider -->
<div class="relative my-4 flex items-center justify-center">
<div class="w-full border-t border-border-hairline"></div>
<span class="absolute px-3 bg-background text-caption-sm font-label-md text-text-tertiary lowercase tracking-wider">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>

</button>

<span class="text-caption-sm text-text-secondary">New to Boatingo?</span>
<a class="text-caption-sm text-primary-container font-semibold hover:underline ml-1" href="#">Create an account</a>
</div>

<footer class="w-full flex-shrink-0 px-gutter pb-2 pt-1 flex flex-col items-center">

      </p>
<!-- Standard iOS Home Indicator Line -->
<div class="w-32 h-1 bg-primary/20 rounded-full mt-3 mb-1"></div>
</footer>
</div>
<!-- Interactive JavaScript for micro-interactions -->
<script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        eyeIcon.textContent = 'visibility';
      }
    }
  </script>
