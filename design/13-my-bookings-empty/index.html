</div>
</div>
<!-- TopAppBar Shared Component -->
<div class="flex justify-between items-center h-14 px-margin w-full max-w-md mx-auto">
<!-- Leading Icon -->
<button aria-label="Marine overview" class="w-9 h-9 rounded-full flex items-center justify-center text-primary dark:text-surface hover:text-secondary dark:hover:text-secondary-fixed transition-colors duration-150 active:opacity-80" type="button">
<span class="material-symbols-outlined text-[22px]">directions_boat</span>
</button>
<!-- Brand Title -->
<h1 class="font-display-lg text-title-md text-primary dark:text-surface text-center tracking-tight">
          My trips
        </h1>
<!-- Trailing Action -->
<button aria-label="Trip filters" class="w-9 h-9 rounded-full flex items-center justify-center text-primary dark:text-surface hover:text-secondary dark:hover:text-secondary-fixed transition-colors duration-150 active:opacity-80" type="button">
<span class="material-symbols-outlined text-[20px]">tune</span>
</button>
</div>
<!-- Segmented Control Bar -->
<div class="px-margin pt-space-xs pb-space-md">
<div aria-label="Trip Status Filter" class="bg-surface-alt p-1 rounded-full flex items-center shadow-inner" role="tablist">
<!-- Upcoming Tab (Active) -->
<button aria-selected="true" class="flex-1 py-2 rounded-full bg-primary-container text-on-primary font-label-md text-caption-sm text-center shadow-sm transition-all duration-150" id="tab-upcoming" role="tab">
            Upcoming
          </button>
<!-- Past Tab (Inactive) -->
<button aria-selected="false" class="flex-1 py-2 rounded-full text-text-secondary hover:text-text-primary font-label-md text-caption-sm text-center transition-all duration-150" id="tab-past" role="tab">
            Past
          </button>
</div>
</div>
</header>
<!-- Main Empty State Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-margin text-center pb-20 pt-2">
<!-- Focal Artwork Frame -->
<div class="relative w-64 h-64 mb-space-lg flex items-center justify-center rounded-[24px] overflow-hidden bg-surface p-2 shadow-[0_1px_2px_rgba(24,22,20,0.04),0_8px_24px_rgba(24,22,20,0.06)] border border-border-hairline">

<!-- Subtle yacht hardware accent glow -->
<div class="absolute inset-0 pointer-events-none rounded-[24px] ring-1 ring-inset ring-black/5"></div>
</div>
<!-- Typography Block -->
<div class="space-y-space-sm max-w-xs">
<h2 class="font-display-lg text-display-lg text-text-primary tracking-tight">

          Boats with live availability are waiting in 8 destinations.

<span>Explore destinations</span>
<span class="material-symbols-outlined text-[18px]">explore</span>
</button>

<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-support-tint/60 text-secondary border border-secondary-container/50">

<span class="font-caption-sm text-[12px] font-medium text-text-secondary">

</span>
</div>

<nav aria-label="Bottom Navigation" class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-gutter bg-surface dark:bg-primary-container max-w-[393px] mx-auto right-0">

<div class="w-32 h-1 bg-text-primary/20 rounded-full"></div>
</div>

<!-- Interactive State Switching for Segmented Control -->
<script>
    const tabUpcoming = document.getElementById('tab-upcoming');
    const tabPast = document.getElementById('tab-past');

    if (tabUpcoming && tabPast) {
      tabUpcoming.addEventListener('click', () => {
        tabUpcoming.classList.add('bg-primary-container', 'text-on-primary', 'shadow-sm');
        tabUpcoming.classList.remove('text-text-secondary');
        tabUpcoming.setAttribute('aria-selected', 'true');

        tabPast.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-sm');
        tabPast.classList.add('text-text-secondary');
        tabPast.setAttribute('aria-selected', 'false');
      });

      tabPast.addEventListener('click', () => {
        tabPast.classList.add('bg-primary-container', 'text-on-primary', 'shadow-sm');
        tabPast.classList.remove('text-text-secondary');
        tabPast.setAttribute('aria-selected', 'true');

        tabUpcoming.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-sm');
        tabUpcoming.classList.add('text-text-secondary');
        tabUpcoming.setAttribute('aria-selected', 'false');
      });
    }
  </script>
</body></html>
